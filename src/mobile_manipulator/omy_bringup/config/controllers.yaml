# OMY 컨트롤러 설정 - 6축 팔 (JTC) + 그리퍼 (rh_r1_joint 하나만 명령, 나머지는 mimic)
controller_manager:
  ros__parameters:
    use_sim_time: True
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: effort_controllers/GripperActionController

arm_controller:
  ros__parameters:
    use_sim_time: True
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    # Gazebo 에서는 velocity 명령 (omy_ros2_control.xacro 설명 참고)
    # 속도 명령 = 궤적 속도(feed-forward) + p * 위치 오차
    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity

    gains:
      joint1: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      joint2: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      joint3: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      joint4: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      joint5: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      joint6: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}

    state_publish_rate: 100.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0

# 0 = 열림, 1.135 rad = 닫힘
# effort 버전 - 목표 각도와의 오차를 PID 로 토크로 바꾸고 goal 의 max_effort 로 제한
# 물체를 쥐면 목표 각도에 못 가고 멈추므로 allow_stalling 으로 성공 처리
gripper_controller:
  ros__parameters:
    use_sim_time: True
    joint: rh_r1_joint
    action_monitor_rate: 20.0
    goal_tolerance: 0.02
    allow_stalling: true
    stall_timeout: 0.5
    stall_velocity_threshold: 0.01
    gains:
      # 물체에 닿으면 오차가 0.3 rad 이상 남으므로 토크가 max_effort 에서 포화 = 일정한 힘으로 쥠
      rh_r1_joint: {p: 20.0, i: 0.0, d: 0.1, i_clamp: 0.0}
